<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan Dennis | Mechanical Engineer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f1f1f1;
      background: #0f0f0f;
      line-height: 1.6;
    }
    :root {
      --navy:   #0f0f0f;
      --blue:   #272727;
      --accent: #f1f1f1;
      --heading:#f1f1f1;
      --red:    #ff0000;
      --light:  #272727;
      --white:  #212121;
      --gray:   #aaaaaa;
      --border: #3d3d3d;
      --shadow: 0 4px 18px rgba(0,0,0,0.4);
      --radius: 10px;
    }
    nav {
      position: sticky; top: 0; z-index: 100;
      background: #0f0f0f;
      border-bottom: 1px solid #303030;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5vw;
      height: 60px;
    }
    .nav-brand { color: #fff; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.02em; }
    .nav-links { display: flex; gap: 0.5rem; list-style: none; }
    .nav-links a { color: #f1f1f1; text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 8px 14px; border-radius: 18px; transition: background 0.2s; }
    .nav-links a:hover { background: #272727; }
    #hero {
      background:
        radial-gradient(650px circle at 88% 25%, rgba(255,255,255,0.07), transparent 60%),
        radial-gradient(550px circle at 8% 85%, rgba(255,255,255,0.05), transparent 55%),
        linear-gradient(135deg, #0a0a0a 0%, #232323 100%);
      color: #fff;
      padding: 90px 5vw 80px;
      display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 40px;
    }
    .hero-content { display: flex; flex-direction: column; align-items: flex-start; flex: 1; }
    .hero-photo-wrap { flex-shrink: 0; position: relative; }
    .hero-photo-wrap::before {
      content: '';
      position: absolute; inset: -26px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 55%, transparent 75%);
      filter: blur(6px);
      z-index: 0;
    }
    .hero-photo-wrap img {
      width: 300px; height: 300px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 4px solid rgba(255,255,255,0.35);
      box-shadow: 0 0 50px 6px rgba(255,255,255,0.1), 0 8px 32px rgba(0,0,0,0.45);
      position: relative; z-index: 1;
    }
    @media (max-width: 680px) {
      #hero { flex-direction: column-reverse; align-items: flex-start; }
      .hero-photo-wrap img { width: 160px; height: 160px; }
    }
    .hero-tag {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(220,38,38,0.65);
      box-shadow: 0 0 10px rgba(220,38,38,0.25);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 18px; color: #d4d4d4;
    }
    #hero h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 800; line-height: 1.1; margin-bottom: 12px; }
    #hero h1 span { color: var(--red); }
    .hero-subtitle { font-size: 1.15rem; color: #d4d4d4; max-width: 560px; margin-bottom: 30px; }
    .hero-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.875rem; color: #c4c4c4; margin-bottom: 36px; }
    .hero-meta span { display: flex; align-items: center; gap: 6px; }
    .hero-buttons { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn { padding: 11px 24px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; border: 2px solid transparent; }
    .btn-primary { background: #fff; color: var(--navy); }
    .btn-primary:hover { background: #dbeafe; }
    .btn-outline { background: transparent; border-color: rgba(255,255,255,0.5); color: #fff; }
    .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #fff; }
    section { padding: 72px 5vw; }
    section:nth-child(even) { background: #181818; }
    .section-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 6px; }
    h2 { font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 800; color: var(--heading); margin-bottom: 10px; }
    .section-intro { color: var(--gray); max-width: 600px; margin-bottom: 44px; }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
    @media (max-width: 700px) { .about-grid { grid-template-columns: 1fr; } }
    .about-text p { color: #d4d4d8; margin-bottom: 14px; }
    .about-highlights { display: flex; flex-direction: column; gap: 14px; }
    .highlight-card { background: var(--light); border-left: 4px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; }
    .highlight-card strong { display: block; color: var(--heading); margin-bottom: 2px; font-size: 0.95rem; }
    .highlight-card span { color: var(--gray); font-size: 0.875rem; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .project-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s; }
    .project-card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(0,0,0,0.16), 0 0 0 1px rgba(0,0,0,0.04); }
    .project-badge { display: inline-block; background: #f1f1f1; color: #0f0f0f; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 20px; padding: 4px 12px; margin-bottom: 12px; }
    .project-card h3 { font-size: 1.05rem; color: var(--heading); margin-bottom: 8px; }
    .project-card p { color: var(--gray); font-size: 0.875rem; line-height: 1.55; margin-bottom: 14px; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: #272727; color: #f1f1f1; border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; font-weight: 500; }
